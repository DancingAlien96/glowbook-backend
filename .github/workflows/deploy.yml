name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys touch the same server at once — that's what
  # corrupted node_modules and raced the container recreate earlier.
  # cancel-in-progress: false means a second push QUEUES instead of killing
  # a deploy that might be mid-migration.
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via Ansible
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Checkout frontend repo (contains Ansible playbooks)
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/DancingAlien96/glowbook-frontend.git \
            ${{ github.workspace }}/../glowbook-frontend
          # Recorded so the Ansible frontend role can assert the server ends
          # up on this exact commit: if a frontend push lands within moments
          # of the backend push that triggers this workflow, this clone can
          # race ahead of it and silently deploy an older frontend commit
          # (the health check only covers the backend API, so that kind of
          # staleness wouldn't otherwise fail the build).
          echo "FRONTEND_SHA=$(git -C ${{ github.workspace }}/../glowbook-frontend rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Deploying frontend commit: $FRONTEND_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and sshpass
        run: |
          pip install ansible
          sudo apt-get install -y sshpass

      - name: Install Ansible collections
        working-directory: ../glowbook-frontend/deploy
        run: ansible-galaxy collection install -r requirements.yml

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Generate vault.yml from GitHub secrets
        run: |
          cat > ../glowbook-frontend/deploy/group_vars/vault.yml << 'EOF'
          ---
          vault_mysql_root_password: "${{ secrets.MYSQL_ROOT_PASSWORD }}"
          vault_mysql_password:      "${{ secrets.MYSQL_PASSWORD }}"
          vault_jwt_access_secret:   "${{ secrets.JWT_ACCESS_SECRET }}"
          vault_jwt_refresh_secret:  "${{ secrets.JWT_REFRESH_SECRET }}"
          vault_resend_api_key:      "${{ secrets.RESEND_API_KEY }}"
          vault_uploadthing_token:   "${{ secrets.UPLOADTHING_TOKEN }}"
          vault_vapid_private_key:   "${{ secrets.VAPID_PRIVATE_KEY }}"
          vault_recurrente_secret_key:     "${{ secrets.RECURRENTE_SECRET_KEY }}"
          vault_recurrente_webhook_secret: "${{ secrets.RECURRENTE_WEBHOOK_SECRET }}"
          vault_backup_encryption_key:     "${{ secrets.BACKUP_ENCRYPTION_KEY }}"
          EOF

      - name: Diagnose billing + double-booking reports (temp, read-only, no PII)
        working-directory: ../glowbook-frontend/deploy
        run: |
          ansible production -i inventory.ini -m shell \
            -a "echo '--- pending subscription receipts ---'; docker exec -e MYSQL_PWD='${{ secrets.MYSQL_PASSWORD }}' glowbook-mysql mysql -u glowbook glowbook -e \"SELECT sp.id, sp.subscriptionId, sp.status, sp.periodMonths, sp.createdAt, sp.reviewedAt, s.salonId FROM SubscriptionPayment sp JOIN Subscription s ON s.id = sp.subscriptionId WHERE sp.status='PENDING_REVIEW' ORDER BY sp.createdAt DESC LIMIT 15;\" 2>&1; echo '--- overdue/suspended subscriptions ---'; docker exec -e MYSQL_PWD='${{ secrets.MYSQL_PASSWORD }}' glowbook-mysql mysql -u glowbook glowbook -e \"SELECT sub.id, sub.salonId, sub.status, sub.currentPeriodEnd, sub.trialEndsAt, sub.updatedAt, sal.name FROM Subscription sub JOIN Salon sal ON sal.id = sub.salonId WHERE sub.status IN ('OVERDUE','SUSPENDED') ORDER BY sub.updatedAt DESC LIMIT 15;\" 2>&1; echo '--- appointment status counts, last 14 days ---'; docker exec -e MYSQL_PWD='${{ secrets.MYSQL_PASSWORD }}' glowbook-mysql mysql -u glowbook glowbook -e \"SELECT status, COUNT(*) FROM Appointment WHERE createdAt > NOW() - INTERVAL 14 DAY GROUP BY status;\" 2>&1; echo '--- recent appointments (no PII) ---'; docker exec -e MYSQL_PWD='${{ secrets.MYSQL_PASSWORD }}' glowbook-mysql mysql -u glowbook glowbook -e \"SELECT id, salonId, stylistId, status, startAt, endAt, createdAt FROM Appointment WHERE createdAt > NOW() - INTERVAL 7 DAY ORDER BY createdAt DESC LIMIT 20;\" 2>&1" \
            --extra-vars "ansible_user=${{ secrets.DEPLOY_USER }}" \
            --extra-vars "ansible_password=${{ secrets.DEPLOY_PASSWORD }}" \
            --extra-vars "ansible_ssh_pass=${{ secrets.DEPLOY_PASSWORD }}"

      - name: Run Ansible deploy (backend + frontend)
        # Host key checking is intentionally left ON — "Configure SSH known
        # hosts" above already populated ~/.ssh/known_hosts with the real
        # key via ssh-keyscan, so this validates against it instead of
        # blindly trusting whatever key answers (MITM protection).
        working-directory: ../glowbook-frontend/deploy
        run: |
          ansible-playbook site.yml \
            --tags deploy \
            --extra-vars "ansible_user=${{ secrets.DEPLOY_USER }}" \
            --extra-vars "ansible_password=${{ secrets.DEPLOY_PASSWORD }}" \
            --extra-vars "ansible_ssh_pass=${{ secrets.DEPLOY_PASSWORD }}" \
            --extra-vars "expected_frontend_sha=${{ env.FRONTEND_SHA }}" \
            --skip-tags vault

      - name: Upload encrypted pre-deploy database backup as a workflow artifact
        # Off-server durability: even if the VPS disk dies, this backup
        # (taken right before the migration ran) lives in GitHub's storage.
        # Safe in this PUBLIC repo because the file is AES-256 encrypted
        # server-side (see roles/backend/tasks/main.yml) — the plaintext
        # dump, which contains real client PII, never leaves the VPS.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-artifact/
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up secrets
        if: always()
        run: rm -f ../glowbook-frontend/deploy/group_vars/vault.yml
