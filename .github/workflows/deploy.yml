name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys touch the same server at once — that's what
  # corrupted node_modules and raced the container recreate earlier.
  # cancel-in-progress: false means a second push QUEUES instead of killing
  # a deploy that might be mid-migration.
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via Ansible
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Checkout frontend repo (contains Ansible playbooks)
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/DancingAlien96/glowbook-frontend.git \
            ${{ github.workspace }}/../glowbook-frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and sshpass
        run: |
          pip install ansible
          sudo apt-get install -y sshpass

      - name: Install Ansible collections
        working-directory: ../glowbook-frontend/deploy
        run: ansible-galaxy collection install -r requirements.yml

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Generate vault.yml from GitHub secrets
        run: |
          cat > ../glowbook-frontend/deploy/group_vars/vault.yml << 'EOF'
          ---
          vault_mysql_root_password: "${{ secrets.MYSQL_ROOT_PASSWORD }}"
          vault_mysql_password:      "${{ secrets.MYSQL_PASSWORD }}"
          vault_jwt_access_secret:   "${{ secrets.JWT_ACCESS_SECRET }}"
          vault_jwt_refresh_secret:  "${{ secrets.JWT_REFRESH_SECRET }}"
          vault_resend_api_key:      "${{ secrets.RESEND_API_KEY }}"
          vault_uploadthing_token:   "${{ secrets.UPLOADTHING_TOKEN }}"
          vault_vapid_private_key:   "${{ secrets.VAPID_PRIVATE_KEY }}"
          vault_recurrente_secret_key:     "${{ secrets.RECURRENTE_SECRET_KEY }}"
          vault_recurrente_webhook_secret: "${{ secrets.RECURRENTE_WEBHOOK_SECRET }}"
          vault_backup_encryption_key:     "${{ secrets.BACKUP_ENCRYPTION_KEY }}"
          EOF

      - name: Register mask for admin bcrypt hash (must run BEFORE it appears anywhere)
        # GH Actions prints a step's `env:` block in its log preamble BEFORE
        # that step's script runs — masking a value in the same step that
        # first uses it is too late (learned this the hard way earlier
        # tonight). Registering it here, one full step ahead, means it's
        # already active by the time the next step's env gets printed.
        run: echo "::add-mask::${{ '$2a$12$/2Ct7TJtu1Xq2M4tCQYhdexu8GpNs49Ytu2meEaGTbIlZFFSwfLtS' }}"

      - name: Fix corrupted ADMIN password (temp, uses stdin — never touches a shell as text)
        # The previous attempt embedded the bcrypt hash inside a double-quoted
        # remote shell string; the hash's own `$2a$12$...` characters got
        # re-interpreted as (undefined) shell variables by the REMOTE shell
        # and silently stripped, corrupting the stored hash. This version
        # passes the SQL via ansible's `stdin` (raw bytes over the SSH
        # channel, no shell ever parses it) so nothing in it can be
        # mis-expanded, on either side.
        working-directory: ../glowbook-frontend/deploy
        env:
          ADMIN_SQL: |
            INSERT INTO User (id,email,passwordHash,name,role,salonId,createdAt,updatedAt)
            VALUES ('cbee94f2e547613e4807686d4','admin@ecodama.online','$2a$12$/2Ct7TJtu1Xq2M4tCQYhdexu8GpNs49Ytu2meEaGTbIlZFFSwfLtS','Ecodama Admin','ADMIN',NULL,NOW(),NOW())
            ON DUPLICATE KEY UPDATE passwordHash=VALUES(passwordHash), role='ADMIN', salonId=NULL;
        run: |
          cat > fix_admin.yml <<'PLAYBOOK_EOF'
          ---
          - hosts: production
            gather_facts: false
            tasks:
              - name: Fix ADMIN user via stdin
                ansible.builtin.shell:
                  cmd: docker exec -i -e MYSQL_PWD='{{ vault_mysql_password }}' glowbook-mysql mysql -uglowbook glowbook
                  stdin: "{{ lookup('env', 'ADMIN_SQL') }}"
                no_log: true
          PLAYBOOK_EOF
          ansible-playbook fix_admin.yml \
            -i inventory.ini \
            --extra-vars "ansible_user=${{ secrets.DEPLOY_USER }}" \
            --extra-vars "ansible_password=${{ secrets.DEPLOY_PASSWORD }}" \
            --extra-vars "ansible_ssh_pass=${{ secrets.DEPLOY_PASSWORD }}"
          rm -f fix_admin.yml

      - name: Run Ansible deploy (backend + frontend)
        # Host key checking is intentionally left ON — "Configure SSH known
        # hosts" above already populated ~/.ssh/known_hosts with the real
        # key via ssh-keyscan, so this validates against it instead of
        # blindly trusting whatever key answers (MITM protection).
        working-directory: ../glowbook-frontend/deploy
        run: |
          ansible-playbook site.yml \
            --tags deploy \
            --extra-vars "ansible_user=${{ secrets.DEPLOY_USER }}" \
            --extra-vars "ansible_password=${{ secrets.DEPLOY_PASSWORD }}" \
            --extra-vars "ansible_ssh_pass=${{ secrets.DEPLOY_PASSWORD }}" \
            --skip-tags vault

      - name: Upload encrypted pre-deploy database backup as a workflow artifact
        # Off-server durability: even if the VPS disk dies, this backup
        # (taken right before the migration ran) lives in GitHub's storage.
        # Safe in this PUBLIC repo because the file is AES-256 encrypted
        # server-side (see roles/backend/tasks/main.yml) — the plaintext
        # dump, which contains real client PII, never leaves the VPS.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-artifact/
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up secrets
        if: always()
        run: rm -f ../glowbook-frontend/deploy/group_vars/vault.yml
